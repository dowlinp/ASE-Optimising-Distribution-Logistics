<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="/components/css/menu.css">
    <script src="/components/js/menu.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Thin Slice Implementation</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 480px;
            margin: 40px auto;
            text-align: center;
            background: url("/videos/Products.png") center / cover fixed;
        }

        button {
            padding: 10px 20px;
            margin: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        #output {
            margin-top: 20px;
            font-size: 20px;
        }

        .fab-group {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1000;
        }

        .fab-row {
            display: flex;
            flex-direction: row;
            gap: 10px;
        }

        .fab {
            width: 200px;
            height: 200px;
            border-radius: 10%;
            font-size: 108px;
            cursor: pointer;
            background: #ffffff;
            color: #000000;
        }

        .fab:hover {
            background: #000000;
            color: #ffffff;
        }

        .basket-button {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            font-size: 28px;
            background: white;
            color: black;
            border: 2px solid black;
            border-radius: 10%;
            cursor: pointer;
            z-index: 1001;
        }

        .basket-button:hover {
            background: black;
            color: white;
        }

        #basketCount {
            position: absolute;
            top: -8px;
            right: -8px;
            background: black;
            color: white;
            border-radius: 50%;
            font-size: 13px;
            padding: 4px 7px;
        }

        .basket-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 300px;
            height: 100%;
            background: white;
            border-left: 2px solid black;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1000;

            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .basket-panel.open {
            transform: translateX(0);
        }

        .basket-panel li {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        .basket-button.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <script>

        let basket = [];

        function addToBasket(title) {
            basket.push(title);
            updateBasket();
        }

        function updateBasket() {
            const basketList = document.getElementById("basketItems");
            const basketCount = document.getElementById("basketCount");

            basketCount.textContent = basket.length;

            basketList.innerHTML = "";

            basket.forEach((item, index) => {

                const listItem = document.createElement("li");
                listItem.textContent = item + " ";

                const removeButton = document.createElement("button");
                removeButton.textContent = "X";

                removeButton.onclick = function () {
                    basket.splice(index, 1);
                    updateBasket();
                };

                listItem.appendChild(removeButton);

                basketList.appendChild(listItem);
            });
        }

        function toggleBasket() {
            const basketPanel = document.getElementById("basketPanel");
            const basketButton = document.querySelector(".basket-button");

            basketPanel.classList.toggle("open");
            basketButton.classList.toggle("hidden");
        }

        function clearBasket() {
            basket = [];
            updateBasket();
        }
        function checkout() {
            if (basket.length === 0) {
                alert("Your basket is empty!");
                return;
            }

            let order = "You have selected:\n\n";

            basket.forEach(item => {
                order += "- " + item + "\n";
            });

            if (confirm(order + "\nConfirm checkout?")) {

                alert("Order submitted successfully!");

                basket = [];
                updateBasket();

                toggleBasket();
            }
        }
    </script>
    <button class="basket-button" onclick="toggleBasket()">
        &#128722;
        <span id="basketCount">0</span>
    </button>

    <div id="basketPanel" class="basket-panel">

        <h2>Your Basket</h2>

        <ul id="basketItems"></ul>

        <div class="basket-actions">
            <button onclick="clearBasket()">Clear basket</button>
            <button onclick="checkout()">Checkout</button>
            <button onclick="toggleBasket()">Close</button>
        </div>

    </div>

    <div class="fab-group">
        <div class="fab-row">
            <button class="fab" onclick="addToBasket('White King')">&#9812;</button>
            <button class="fab" onclick="addToBasket('White Queen')">&#9813;</button>
            <button class="fab" onclick="addToBasket('White Rook')">&#9814;</button>
            <button class="fab" onclick="addToBasket('White Bishop')">&#9815;</button>
            <button class="fab" onclick="addToBasket('White Knight')">&#9816;</button>
            <button class="fab" onclick="addToBasket('White Pawn')">&#9817;</button>
        </div>

        <div class="fab-row">
            <button class="fab" onclick="addToBasket('Black King')">&#9818;</button>
            <button class="fab" onclick="addToBasket('Black Queen')">&#9819;</button>
            <button class="fab" onclick="addToBasket('Black Rook')">&#9820;</button>
            <button class="fab" onclick="addToBasket('Black Bishop')">&#9821;</button>
            <button class="fab" onclick="addToBasket('Black Knight')">&#9822;</button>
            <button class="fab" onclick="addToBasket('Black Pawn')">&#9823;</button>
        </div>
    </div>

    <script>
        function togglePanel() {
            document.getElementById("sidePanel").classList.toggle("open");
        }
        function show(text) {
            document.getElementById("output").textContent = text;
        }
    </script>

</body>

</html>
