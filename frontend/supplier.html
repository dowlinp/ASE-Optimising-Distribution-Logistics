<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add a Product | Supplier Interface</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 32px 16px; }
    main { max-width: 480px; margin: auto; background: white; padding: 28px; border-radius: 10px; }
    h1 { margin-top: 0; }
    label { display: block; margin: 16px 0 6px; font-weight: bold; }
    input, textarea, select { box-sizing: border-box; width: 100%; padding: 10px; border: 1px solid #aaa; border-radius: 5px; font: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    button { margin-top: 20px; padding: 12px 18px; background: #222; color: white; border: 0; border-radius: 5px; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #message { margin-top: 16px; }
    .success { color: #176b35; }
    .error { color: #ad2525; }
  </style>
</head>
<body>
  <main>
    <h1>Add a Product</h1>
    <p>Complete all required fields to submit a new product listing.</p>

    <form id="listingForm" novalidate>
      <label for="supplierId">Supplier ID *</label>
      <input id="supplierId" name="supplierId" type="text" required>

      <label for="productId">Product ID *</label>
      <input id="productId" name="productId" type="text" required>

      <label for="productName">Product Name *</label>
      <input id="productName" name="productName" type="text" required>

      <label for="description">Description *</label>
      <textarea id="description" name="description" required></textarea>

      <label for="price">Price *</label>
      <input id="price" name="price" type="number" min="0.01" step="0.01" required>

      <label for="productType">Product/Service Type *</label>
      <select id="productType" name="productType" required>
        <option value="">Select type</option>
        <option value="product">Product</option>
        <option value="service">Service</option>
      </select>

      <label for="image">Product Image (coming later)</label>
      <input id="image" type="file" accept="image/*" disabled>

      <button type="submit">Submit Product</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const form = document.getElementById("listingForm");
    const message = document.getElementById("message");

    // Agreed text-only endpoint; Java backend must implement it.
    async function submitListing(supplierId, productDetails) {
      const data = new URLSearchParams({ supplierId, ...productDetails });
      const response = await fetch("/api/products", { method: "POST", body: data });
      const result = await response.json();
      if (!response.ok || !result.success) {
        throw new Error(result.message || `Catalogue Management returned error ${response.status}.`);
      }
      return result;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      message.className = "";

      if (!form.checkValidity()) {
        message.textContent = "Please complete all required fields and enter a valid price.";
        message.className = "error";
        form.reportValidity();
        return;
      }

      const supplierId = form.elements.supplierId.value.trim();
      const productDetails = {
        productId: form.elements.productId.value.trim(),
        productName: form.elements.productName.value.trim(),
        description: form.elements.description.value.trim(),
        price: form.elements.price.value,
        productType: form.elements.productType.value
      };

      if (!supplierId || !productDetails.productId || !productDetails.productName || !productDetails.description) {
        message.textContent = "All text fields must contain text.";
        message.className = "error";
        return;
      }

      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        const result = await submitListing(supplierId, productDetails);
        message.textContent = result.message || "Product successfully listed!";
        message.className = "success";
        form.reset();
      } catch (error) {
        message.textContent = `Product not listed. ${error.message}`;
        message.className = "error";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
