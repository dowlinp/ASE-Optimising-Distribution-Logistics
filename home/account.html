<link rel="stylesheet" href="/css/menu.css">

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Creation</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #Account_Details {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 300px;
}

#Account_Details input {
    padding: 10px;
    font-size: 16px;
}

#Account_Details label {
    font-weight: bold;
}

#Account_Details button {
    padding: 12px;
    margin-top: 10px;
    cursor: pointer;
}

#Account_Details sub {
    color: grey;
    font-size: 12px;
    margin-top: -5px;
}

  </style>
</head>
<body>
  <div class="menu" onclick="toggleMenu()">☰</div>
  <div class="side-panel" id="sidePanel">
    <div class="close-menu" onclick="toggleMenu()">✖</div>
    <h2>Navigation</h2>
    <a href="/">Home</a>
    <a href="/User">User</a>
    <a href="/Warehouse">Warehouse</a>
    <a href="/Delivery">Delivery</a>
    <a href="/Account">Account</a>
  </div>

  <form id="Account_Details">

    <label>Account Type:</label>
    <sub>Non customer account types will require additional verification</sub>
    <select id="account_type" required>
        <option value="">Select your account type</option>
        <option value="Admin">Admin</option>
        <option value="Warehouse">Warehouse</option>
        <option value="Delivery">Delivery</option>
        <option value="Customer">Customer</option>
    </select>

    <label>Username:</label>
    <input type="text" id="username" required>

    <label>Password:</label>
    <input type="password" id="password" required>

    <label>Retype Password:</label>
    <input type="password" id="r_password" required>

    <label>Phone Number:</label>
    <input type="tel" id="phone" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <label>Date of Birth:</label>
    <input type="date" id="dob" required>

    <label>Address:</label>
    <sub>Enter your full delivery address</sub>
    <input type="text" id="address" required>
    <sub>Enter your Eircode</sub>
    <input type="text" id="eircode" required>

    <button type="submit">Submit</button>

</form>

<div id="verification" style="display: none; text-align: center;">
    <h2 id="verificationTitle">Verifying your email...</h2>
    <p id="verificationMessage">
        Please wait while we verify your email address.
    </p>
</div>

<script>
    function toggleMenu() {
        document.getElementById('sidePanel').classList.toggle('open');
    }

    document.getElementById("Account_Details").addEventListener("submit", function(event) {

        event.preventDefault();

        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (password !== document.getElementById("r_password").value) {
            alert("Passwords do not match!");
            return;
        }

        setTimeout(() => {

            document.getElementById("verificationTitle").textContent = "Email Confirmed!";
            document.getElementById("verificationMessage").textContent =
                "Your account has been created. Redirecting to home...";

            sessionStorage.setItem("loggedIn", "true");
            sessionStorage.setItem("username", username);
            sessionStorage.setItem("email", email);

            setTimeout(() => {window.location.href = "/";}, 2000);

        }, 10000);
    });
</script>


</body>
