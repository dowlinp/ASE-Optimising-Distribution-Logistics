<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="/components/css/menu.css">
    <script src="/components/js/menu.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Creation</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #Account_Details {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 300px;
        }

        #Account_Details input {
            padding: 10px;
            font-size: 16px;
        }

        #Account_Details label {
            font-weight: bold;
        }

        #Account_Details button {
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        #Account_Details sub {
            color: grey;
            font-size: 12px;
            margin-top: -5px;
        }
    </style>
</head>

<body>
    <form id="Account_Details">

        <label>Account Type:</label>
        <sub>Non customer account types will require additional verification</sub>
        <select id="account_type" required>
            <option value="">Select your account type</option>
            <option value="Admin">Admin</option>
            <option value="Warehouse">Warehouse</option>
            <option value="Delivery">Delivery</option>
            <option value="Customer">Customer</option>
        </select>

        <label>Username:</label>
        <input type="text" id="username" required>

        <label>Password:</label>
        <input type="password" id="password" required>

        <label>Retype Password:</label>
        <input type="password" id="r_password" required>

        <label>Phone Number:</label>
        <input type="tel" id="phone" required>

        <label>Email:</label>
        <input type="email" id="email" required>

        <label>Date of Birth:</label>
        <input type="date" id="dob" required>

        <label>Address:</label>
        <sub>Enter your full delivery address</sub>
        <input type="text" id="address" required>
        <sub>Enter your Eircode</sub>
        <input type="text" id="eircode" required>

        <button type="submit">Submit</button>

    </form>

    <div id="verification" style="display: none; text-align: center;">
        <h2 id="verificationTitle">Verifying your email...</h2>
        <p id="verificationMessage">
            Please wait while we verify your email address.
        </p>
    </div>

    <script>


        document.getElementById("Account_Details").addEventListener("submit", async function (event) {

            event.preventDefault();

            const username = document.getElementById("username").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const rPassword = document.getElementById("r_password").value;
            const phone = document.getElementById("phone").value;
            const address = document.getElementById("address").value;
            const eircode = document.getElementById("eircode").value;

            if (password !== rPassword) {
                alert("Passwords do not match!");
                return;
            }

            const button = document.querySelector("#Account_Details button");
            button.disabled = true;
            button.textContent = "Creating account...";

            try {
                const response = await fetch("/api/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        username: username,
                        email: email,
                        password: password,
                        phoneNumber: phone,
                        address: address,
                        eircode: eircode
                    })
                });

                const message = await response.text();

                if (!response.ok) {
                    throw new Error(message);
                }

                // Account successfully saved to PostgreSQL
                document.getElementById("Account_Details").style.display = "none";
                document.getElementById("verification").style.display = "block";

                document.getElementById("verificationTitle").textContent =
                    "Account Created!";

                document.getElementById("verificationMessage").textContent =
                    message + " Redirecting to home...";

                sessionStorage.setItem("loggedIn", "true");
                sessionStorage.setItem("username", username);
                sessionStorage.setItem("email", email);

                setTimeout(() => {
                    window.location.href = "/";
                }, 2000);

            } catch (error) {
                alert("Registration failed: " + error.message);

                button.disabled = false;
                button.textContent = "Submit";
            }
        });

    </script>

</body>
