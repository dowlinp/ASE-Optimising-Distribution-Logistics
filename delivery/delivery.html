<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Driver round</title>
  <link rel="stylesheet" href="/delivery/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/delivery/driver.css">
  <script src="/delivery/vendor/leaflet/leaflet.js" defer></script>
  <script src="/delivery/driver.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a href="/">Home</a>
      <p class="eyebrow">Distribution logistics</p>
      <h1>Driver round</h1>
    </header>

    <form id="driver-form">
      <label for="driver-id">Driver ID</label>
      <div class="entry-controls">
        <input id="driver-id" name="driverId" required maxlength="100" autocomplete="username">
        <button type="submit">Start round</button>
      </div>
    </form>
    <p id="error" role="alert" hidden></p>
    <button id="retry-button" class="secondary" type="button" hidden>Retry</button>

    <!-- Reveal the round only after assignment and navigation load successfully. -->
    <section id="round" aria-label="Assigned round" hidden>
      <p class="assignment">Vehicle <strong data-testid="vehicle-id"></strong>
        <span aria-hidden="true"> / </span> Round <strong data-testid="round-id"></strong></p>
      <h2 data-testid="navigation-mode"></h2>
      <p id="destination"></p>

      <dl class="metrics">
        <div><dt>Next stop ETA</dt><dd data-testid="next-stop-eta"></dd></div>
        <div><dt>Finish at hub</dt><dd data-testid="estimated-finish-time"></dd></div>
        <div><dt>Stops left</dt><dd data-testid="remaining-stops"></dd></div>
      </dl>

      <section id="round-summary" aria-labelledby="summary-title" aria-live="polite" hidden>
        <h2 id="summary-title">Round summary</h2>
        <dl class="metrics">
          <div><dt>Succeeded</dt><dd data-testid="succeeded-count"></dd></div>
          <div><dt>Failed</dt><dd data-testid="failed-count"></dd></div>
        </dl>
        <p>Delivery tasks finished. Follow the route back to the hub.</p>
      </section>

      <div id="map" aria-label="Round route map"></div>
      <button id="instructions-button" class="secondary" type="button">Delivery instructions</button>

      <section id="task" aria-label="Current delivery">
        <h2>Task <span data-testid="task-id"></span></h2>
        <p id="proof-status" role="status">Take a photo before confirming this delivery.</p>
        <div class="task-controls">
          <button id="photo-button" class="secondary" type="button">Take photo</button>
          <button id="confirm-button" type="button" disabled>Confirm delivery</button>
          <button id="failed-button" class="secondary" type="button">Failed task</button>
        </div>
      </section>
    </section>

    <dialog id="instructions-dialog" aria-labelledby="instructions-title">
      <h2 id="instructions-title">Delivery instructions</h2>
      <p id="instructions-text"></p>
      <button id="close-instructions" type="button">Close instructions</button>
    </dialog>
  </main>
</body>
</html>
