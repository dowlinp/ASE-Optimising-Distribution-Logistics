<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.3/dist/leaflet.css">

    <script type="importmap">
        {
            "imports": {
                "leaflet": "https://cdn.jsdelivr.net/npm/leaflet@2.0.0-beta.3/dist/leaflet.js"
            }
        }
    </script>

    <title>Delivery Map</title>

    <style>
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #map {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <!-- Map and route -->
    <script type="module">

        import {
            LeafletMap,
            TileLayer,
            GeoJSON
        } from 'leaflet';

        // Create map
        const map = new LeafletMap('map')
            .setView([53.33333, -6.24889], 11);

        // Add OpenStreetMap background
        new TileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap'
            }
        ).addTo(map);

        // Load delivery route
        console.log("Loading delivery route...");

        const response = await fetch(
            "/routes/order_123.geojson"
        );

        const data = await response.json();

        // Add GeoJSON to map
        const routeLayer = new GeoJSON(data, {

            style: function (feature) {
                return {
                    color: "blue",
                    weight: 5,
                    opacity: 0.9
                };
            }

        });

        routeLayer.addTo(map);



    </script>


    <!-- Menu -->
    <button id="menu" class="menu" onclick="togglePanel()">
        ☰
    </button>

    <div id="sidePanel" class="side-panel">

        <button class="close-menu" onclick="togglePanel()">
            &times;
        </button>

        <h2>Menu</h2>

        <a href="/">Home</a>
        <a href="/User">User</a>
        <a href="/Warehouse">Warehouse</a>
        <a href="/Delivery">Delivery</a>
        <a href="/Account">Account</a>

    </div>


    <script>

        function togglePanel() {

            document.getElementById("sidePanel")
                .classList.toggle("open");

        }

    </script>

</body>

</html>
